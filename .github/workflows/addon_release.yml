name: Add-on release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install validation tools
        shell: pwsh
        run: python -m pip install -r dev-requirements.txt

      - name: Provision build references
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/build/provision-reference.ps1 -FromUpstream -Profile build

      - name: Build release add-on
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/build/Build-AddOn29.ps1 RelWithDebInfo

      - name: Name release asset
        shell: pwsh
        run: Copy-Item -LiteralPath AddOn/EvP/build_29/EvP.apx -Destination Tapioca_AC29_Win.apx -Force

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: Tapioca_AC29_Win.apx
