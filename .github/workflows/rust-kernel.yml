name: Rust kernel scaffold

on:
  push:
    paths:
      - AddOn/EvP/rust/**
      - AddOn/EvP/cmake/RustKernel.cmake
      - AddOn/EvP/CMakeLists.txt
      - tools/quality/check_rust.py
      - tools/quality/check_secrets.py
      - tools/quality/tests/test_check_rust.py
      - tools/quality/tests/test_check_secrets.py
      - tools/build/Setup-Rust.ps1
      - tools/build/Build-AddOn29.ps1
      - .github/workflows/rust-kernel.yml
  pull_request:
    paths:
      - AddOn/EvP/rust/**
      - AddOn/EvP/cmake/RustKernel.cmake
      - AddOn/EvP/CMakeLists.txt
      - tools/quality/check_rust.py
      - tools/quality/check_secrets.py
      - tools/quality/tests/test_check_rust.py
      - tools/quality/tests/test_check_secrets.py
      - tools/build/Setup-Rust.ps1
      - tools/build/Build-AddOn29.ps1
      - .github/workflows/rust-kernel.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned toolchain and components
        shell: pwsh
        run: |
          $pin = Get-Content AddOn/EvP/rust/rust-toolchain.toml -Raw
          if ($pin -notmatch 'channel\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"') { throw 'Missing toolchain pin' }
          rustup toolchain install $Matches[1] --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check, test, and compile scaffold
        run: python tools/quality/check_rust.py
      - name: Compile standalone CMake target (no SDK or add-on link)
        if: runner.os == 'Windows'
        run: |
          cmake -S AddOn/EvP/rust -B AddOn/EvP/rust/build
          cmake --build AddOn/EvP/rust/build --target TapiocaRustKernel --config RelWithDebInfo
      - name: Test enforcement
        run: |
          python -m pip install pytest
          python -m pytest tools/quality/tests/test_check_rust.py tools/quality/tests/test_check_secrets.py -q
