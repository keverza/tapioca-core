name: Rust kernel foundation

on:
  push:
    paths:
      - AddOn/EvP/rust/**
      - AddOn/EvP/cmake/RustKernel.cmake
      - AddOn/EvP/CMakeLists.txt
      - tools/quality/check_rust.py
      - tools/quality/check_secrets.py
      - tools/quality/tests/test_check_rust.py
      - tools/quality/tests/test_check_secrets.py
      - tools/build/Setup-Rust.ps1
      - tools/build/Build-AddOn29.ps1
      - AddOn/EvP/Sources/AddOn/Geometry/GeometryRustFfi.h
      - AddOn/EvP/Sources/AddOn/Geometry/GeometryRustTerrain.*
      - AddOn/EvP/Sources/AddOn/Geometry/GeometryRustIdentity.cpp
      - AddOn/EvP/Sources/AddOn/Geometry/GeometryRustValue.cpp
      - AddOn/EvP/Sources/AddOn/Geometry/GeometryRustAffine.cpp
      - AddOn/EvP/Sources/AddOn/Geometry/GeometryRustArc.cpp
      - AddOn/EvP/Sources/AddOn/Geometry/GeometryRustPolyline.cpp
      - AddOn/EvP/Sources/AddOn/Geometry/GeometryRustPlane.cpp
      - AddOn/EvP/Sources/AddOn/Geometry/GeometryIdentity.hpp
      - .github/workflows/rust-kernel.yml
  pull_request:
    paths:
      - AddOn/EvP/rust/**
      - AddOn/EvP/cmake/RustKernel.cmake
      - AddOn/EvP/CMakeLists.txt
      - tools/quality/check_rust.py
      - tools/quality/check_secrets.py
      - tools/quality/tests/test_check_rust.py
      - tools/quality/tests/test_check_secrets.py
      - tools/build/Setup-Rust.ps1
      - tools/build/Build-AddOn29.ps1
      - AddOn/EvP/Sources/AddOn/Geometry/GeometryRustFfi.h
      - AddOn/EvP/Sources/AddOn/Geometry/GeometryRustTerrain.*
      - AddOn/EvP/Sources/AddOn/Geometry/GeometryRustIdentity.cpp
      - AddOn/EvP/Sources/AddOn/Geometry/GeometryRustValue.cpp
      - AddOn/EvP/Sources/AddOn/Geometry/GeometryRustAffine.cpp
      - AddOn/EvP/Sources/AddOn/Geometry/GeometryRustArc.cpp
      - AddOn/EvP/Sources/AddOn/Geometry/GeometryRustPolyline.cpp
      - AddOn/EvP/Sources/AddOn/Geometry/GeometryRustPlane.cpp
      - AddOn/EvP/Sources/AddOn/Geometry/GeometryIdentity.hpp
      - .github/workflows/rust-kernel.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned toolchain and components
        shell: pwsh
        run: |
          $pin = Get-Content AddOn/EvP/rust/rust-toolchain.toml -Raw
          if ($pin -notmatch 'channel\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"') { throw 'Missing toolchain pin' }
          rustup toolchain install $Matches[1] --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check, test, and compile foundation
        run: python tools/quality/check_rust.py
      - name: Link and run C and C++ ABI smoke test (no SDK or add-on link)
        shell: bash
        run: |
          cmake -S AddOn/EvP/rust -B AddOn/EvP/rust/build
          cmake --build AddOn/EvP/rust/build --target TapiocaRustAbiSmoke TapiocaRustWrapperFailure TapiocaRustIdentitySmoke TapiocaRustValueSmoke TapiocaRustAffineSmoke TapiocaRustPolylineSmoke TapiocaRustPolylineFailure TapiocaRustArcSmoke TapiocaRustArcFailure TapiocaRustPlaneSmoke TapiocaRustPlaneFailure --config RelWithDebInfo
          ctest --test-dir AddOn/EvP/rust/build -C RelWithDebInfo --output-on-failure
      - name: Verify Windows Debug uses the same release Rust archive and CRT
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cmake --build AddOn/EvP/rust/build --target TapiocaRustAbiSmoke TapiocaRustWrapperFailure TapiocaRustIdentitySmoke TapiocaRustValueSmoke TapiocaRustAffineSmoke TapiocaRustPolylineSmoke TapiocaRustPolylineFailure TapiocaRustArcSmoke TapiocaRustArcFailure TapiocaRustPlaneSmoke TapiocaRustPlaneFailure --config Debug
          ctest --test-dir AddOn/EvP/rust/build -C Debug --output-on-failure
      - name: Test enforcement
        run: |
          python -m pip install pytest
          python -m pytest tools/quality/tests/test_check_rust.py tools/quality/tests/test_check_secrets.py -q
