[workspace]
members = ["geometry", "raycast", "sunstudy", "ffi"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
publish = false

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
indexing_slicing = "warn"
float_cmp = "warn"
lossy_float_literal = "warn"
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
# These are review signals, not reasons to split a coherent algorithm.
too_many_lines = "allow"
cognitive_complexity = "allow"
excessive_nesting = "allow"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
debug = 2
strip = "none"
# Keep LLVM bitcode out of the MSVC link until mixed-language LTO is measured.
lto = false
